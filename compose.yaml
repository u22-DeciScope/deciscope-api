services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deciscope}
      POSTGRES_USER: ${POSTGRES_USER:-deciscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deciscope} -d ${POSTGRES_DB:-deciscope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    command: ["/app/deciscope-api", "migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-deciscope}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-deciscope}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      PORT: ${API_PORT:-9090}
      DATABASE_URL: "postgres://${POSTGRES_USER:-deciscope}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-deciscope}?sslmode=disable"
      DECISCOPE_INGEST_API_KEY: ${DECISCOPE_INGEST_API_KEY:?DECISCOPE_INGEST_API_KEY is required}
      DECISCOPE_CREATE_SAMPLE_MEETING_ON_FIRST_WORKSPACE: ${DECISCOPE_CREATE_SAMPLE_MEETING_ON_FIRST_WORKSPACE:-}
      DECISCOPE_WS_ALLOWED_ORIGINS: ${DECISCOPE_WS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      DECISCOPE_BOT_CONTROL_URL: ${DECISCOPE_BOT_CONTROL_URL:-}
      DECISCOPE_BOT_CONTROL_TOKEN: ${DECISCOPE_BOT_CONTROL_TOKEN:-}
      DECISCOPE_BOT_CONTROL_TIMEOUT_SECONDS: ${DECISCOPE_BOT_CONTROL_TIMEOUT_SECONDS:-10}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5193}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5193}
      DECISCOPE_ENV: ${DECISCOPE_ENV:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/serviceAccountKey.json
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_CONTEXT_PLANNER_DEPLOYMENT: ${AZURE_OPENAI_CONTEXT_PLANNER_DEPLOYMENT:-}
      AZURE_OPENAI_LIVE_EXTRACTION_DEPLOYMENT: ${AZURE_OPENAI_LIVE_EXTRACTION_DEPLOYMENT:-}
      AZURE_OPENAI_TREE_AUDIT_DEPLOYMENT: ${AZURE_OPENAI_TREE_AUDIT_DEPLOYMENT:-}
      AZURE_OPENAI_TREE_REORGANIZER_DEPLOYMENT: ${AZURE_OPENAI_TREE_REORGANIZER_DEPLOYMENT:-}
      AZURE_OPENAI_FINAL_TREE_REVIEW_DEPLOYMENT: ${AZURE_OPENAI_FINAL_TREE_REVIEW_DEPLOYMENT:-}
      AZURE_OPENAI_FINAL_SUMMARY_DEPLOYMENT: ${AZURE_OPENAI_FINAL_SUMMARY_DEPLOYMENT:-}
      AI_LIVE_ANALYSIS_ENABLED: ${AI_LIVE_ANALYSIS_ENABLED:-true}
      AI_LIVE_ANALYSIS_INTERVAL_SECONDS: ${AI_LIVE_ANALYSIS_INTERVAL_SECONDS:-10}
      AI_LIVE_ANALYSIS_DEBOUNCE_MILLISECONDS: ${AI_LIVE_ANALYSIS_DEBOUNCE_MILLISECONDS:-2000}
      AI_LIVE_ANALYSIS_COOLDOWN_SECONDS: ${AI_LIVE_ANALYSIS_COOLDOWN_SECONDS:-8}
      AI_LIVE_ANALYSIS_MAX_WAIT_SECONDS: ${AI_LIVE_ANALYSIS_MAX_WAIT_SECONDS:-18}
      AI_LIVE_ANALYSIS_MIN_CHARS: ${AI_LIVE_ANALYSIS_MIN_CHARS:-80}
      AI_LIVE_ANALYSIS_MAX_INPUT_CHARS: ${AI_LIVE_ANALYSIS_MAX_INPUT_CHARS:-4000}
      AI_FINAL_SUMMARY_ENABLED: ${AI_FINAL_SUMMARY_ENABLED:-true}
      AI_FINAL_SUMMARY_MAX_INPUT_CHARS: ${AI_FINAL_SUMMARY_MAX_INPUT_CHARS:-12000}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-20}
      AI_FINAL_SUMMARY_TIMEOUT_SECONDS: ${AI_FINAL_SUMMARY_TIMEOUT_SECONDS:-60}
      TREE_AUDIT_ENABLED: ${TREE_AUDIT_ENABLED:-true}
      TREE_AUDIT_INTERVAL_VERSIONS: ${TREE_AUDIT_INTERVAL_VERSIONS:-3}
      TREE_AUDIT_INTERVAL_SECONDS: ${TREE_AUDIT_INTERVAL_SECONDS:-300}
      TREE_AUDIT_MIN_INTERVAL_SECONDS: ${TREE_AUDIT_MIN_INTERVAL_SECONDS:-300}
      TREE_AUDIT_MAX_RUNS_PER_SESSION: ${TREE_AUDIT_MAX_RUNS_PER_SESSION:-20}
      TREE_AUDIT_MAX_RUNS_PER_HOUR: ${TREE_AUDIT_MAX_RUNS_PER_HOUR:-12}
      TREE_AUDIT_HIGH_SEVERITY_MIN_INTERVAL_SECONDS: ${TREE_AUDIT_HIGH_SEVERITY_MIN_INTERVAL_SECONDS:-60}
      TREE_AUDIT_HIGH_SEVERITY_MAX_RUNS_PER_HOUR: ${TREE_AUDIT_HIGH_SEVERITY_MAX_RUNS_PER_HOUR:-4}
      TREE_AUDIT_TIMEOUT_SECONDS: ${TREE_AUDIT_TIMEOUT_SECONDS:-25}
      TREE_AUDIT_MAX_OUTPUT_TOKENS: ${TREE_AUDIT_MAX_OUTPUT_TOKENS:-2500}
      TREE_AUDIT_MAX_NODES: ${TREE_AUDIT_MAX_NODES:-80}
      TREE_AUDIT_MAX_RECENT_SEGMENTS: ${TREE_AUDIT_MAX_RECENT_SEGMENTS:-16}
      TREE_AUDIT_MAX_EVIDENCE_SEGMENTS: ${TREE_AUDIT_MAX_EVIDENCE_SEGMENTS:-24}
      TREE_AUDIT_MAX_INPUT_TOKENS: ${TREE_AUDIT_MAX_INPUT_TOKENS:-12000}
      TREE_AUDIT_MAX_PERSISTED_JSON_BYTES: ${TREE_AUDIT_MAX_PERSISTED_JSON_BYTES:-262144}
      TREE_AUDIT_HIGH_CONFIDENCE_THRESHOLD: ${TREE_AUDIT_HIGH_CONFIDENCE_THRESHOLD:-0.90}
      TREE_AUDIT_REQUIRED_IMPROVEMENT_MARGIN: ${TREE_AUDIT_REQUIRED_IMPROVEMENT_MARGIN:-0.18}
      TREE_AUDIT_COHESION_THRESHOLD: ${TREE_AUDIT_COHESION_THRESHOLD:-0.20}
      TREE_AUDIT_TENTATIVE_MAX_VERSIONS: ${TREE_AUDIT_TENTATIVE_MAX_VERSIONS:-3}
      TREE_AUDIT_UNAPPLIED_WARNING_THRESHOLD: ${TREE_AUDIT_UNAPPLIED_WARNING_THRESHOLD:-3}
      DECISCOPE_CLIENT_DIAGNOSTICS_ENABLED: ${DECISCOPE_CLIENT_DIAGNOSTICS_ENABLED:-true}
      DECISCOPE_CLIENT_DIAGNOSTICS_DIR: ${DECISCOPE_CLIENT_DIAGNOSTICS_DIR:-/app/logs/client-diagnostics}
      DECISCOPE_CLIENT_DIAGNOSTICS_MAX_FILE_MB: ${DECISCOPE_CLIENT_DIAGNOSTICS_MAX_FILE_MB:-10}
      DECISCOPE_CLIENT_DIAGNOSTICS_RETENTION_DAYS: ${DECISCOPE_CLIENT_DIAGNOSTICS_RETENTION_DAYS:-7}
      DECISCOPE_CLIENT_DIAGNOSTICS_MAX_EVENTS_PER_REQUEST: ${DECISCOPE_CLIENT_DIAGNOSTICS_MAX_EVENTS_PER_REQUEST:-100}
      DECISCOPE_CLIENT_DIAGNOSTICS_THROTTLE_MS: ${DECISCOPE_CLIENT_DIAGNOSTICS_THROTTLE_MS:-1000}
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      # クライアント診断ログ({sessionId}.jsonl)をホストから直接参照するための bind mount。
      # ホスト側: ./logs/client-diagnostics/{sessionId}.jsonl
      # APIコンテナは非rootユーザー(deciscope)で動くため、Linuxホストでは
      # ディレクトリが書き込み可能である必要がある(未作成のままDockerに作らせると
      # root所有になり書けない)。書けない場合はJSONL出力を諦めて標準ログのみへ
      # 縮退し、起動時に理由をログへ出す。
      #   mkdir -p logs/client-diagnostics && chmod 777 logs/client-diagnostics
      - ./logs/client-diagnostics:/app/logs/client-diagnostics
    ports:
      - "${API_PORT:-9090}:${API_PORT:-9090}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
