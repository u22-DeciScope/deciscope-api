services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deciscope}
      POSTGRES_USER: ${POSTGRES_USER:-deciscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deciscope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deciscope} -d ${POSTGRES_DB:-deciscope}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
