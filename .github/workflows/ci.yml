name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate UTF-8
        run: node scripts/check-text-files.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Evaluator unit and mutation tests
        run: go test ./internal/application/... ./cmd/meeting-quality-eval -run MeetingQuality -count=1
      - name: MeetingAnalysisService quality integration
        run: go test ./internal/application -run MeetingQualityServiceIntegration -count=1
      - name: Architecture dependency tests
        run: go test ./internal/architecture -count=1
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Deterministic meeting quality regression
        run: go run ./cmd/meeting-quality-eval -suite deterministic -compare-baseline
