name: Sync Kubernetes API secret

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: deciscope-api-prod
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Apply API runtime secret
        run: |
          kubectl create namespace deciscope --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic deciscope-api-env \
            --namespace deciscope \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=AUTH_PROVIDER="${AUTH_PROVIDER}" \
            --from-literal=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --from-literal=FIREBASE_CREDENTIALS_JSON="${FIREBASE_CREDENTIALS_JSON}" \
            --from-literal=FRONTEND_URL="${FRONTEND_URL}" \
            --from-literal=ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
            --from-literal=SESSION_COOKIE_SECURE="${SESSION_COOKIE_SECURE}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_PROVIDER: ${{ secrets.AUTH_PROVIDER }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
