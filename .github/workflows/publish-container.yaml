name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: deciscope-api-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...
      - run: go vet ./...

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes manifests in yd-network
        env:
          INFRA_REPO_PAT: ${{ secrets.INFRA_REPO_PAT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="sha-${GITHUB_SHA::7}"
          
          git clone https://x-access-token:${INFRA_REPO_PAT}@github.com/yukiidayo/yd-network.git infra
          cd infra
          
          sed -i "s|image: ghcr.io/u22-deciscope/deciscope-api:.*|image: ghcr.io/u22-deciscope/deciscope-api:${SHORT_SHA}|g" k8s/manifests/deciscope/api.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/manifests/deciscope/api.yaml
          git commit -m "chore(api): deploy ${SHORT_SHA}" || echo "No changes to commit"
          git push origin main
